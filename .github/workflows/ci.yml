name: CI - Build and Test Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # Opcional: Ejecutar solo si hay cambios en el backend
    paths:
      - 'proyecto-resenas-backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    # IMPORTANTE: Define el directorio de trabajo para este job
    defaults:
      run:
        working-directory: ./proyecto-resenas-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Los comandos ahora se ejecutan dentro de la carpeta definida en 'defaults'
      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build