name: Rollback on Failed Deploy

on:
  workflow_run:
    workflows: ["CD - Deploy Backend"] # <-- Debe coincidir con el 'name:' del cd.yml
    types:
      - completed
    branches:
      - main

jobs:
  rollback:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Notify deployment failure
        run: |
          echo "⚠️ Deployment to Render failed!"
          echo "🔄 Initiating automatic rollback..."

      - name: Get last successful deploy
        id: get-deploy
        run: |
          echo "🔍 Searching for last successful deployment..."
          
          DEPLOYS=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys?limit=10")
          
          LAST_SUCCESS=$(echo "$DEPLOYS" | jq -r '[.[] | select(.deploy.status=="live")][0].deploy.id')
          
          if [ "$LAST_SUCCESS" == "null" ] || [ -z "$LAST_SUCCESS" ]; then
            echo "❌ No previous successful deployment found"
            exit 1
          fi
          
          echo "✅ Found last successful deployment: $LAST_SUCCESS"
          echo "deploy_id=$LAST_SUCCESS" >> $GITHUB_OUTPUT

      - name: Execute rollback
        id: execute-rollback # Damos un ID al paso
        run: |
          echo "🔄 Executing rollback to deployment: ${{ steps.get-deploy.outputs.deploy_id }}"
          
          # Capturamos la respuesta de la API de rollback
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/${{ steps.get-deploy.outputs.deploy_id }}/rollback")
          
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_CODE/d')
          
          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 201 ]; then
            echo "❌ Rollback trigger failed. HTTP Code: $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          # Extraemos el ID del *nuevo* despliegue de rollback
          NEW_DEPLOY_ID=$(echo "$BODY" | jq -r '.id')
          
          if [ -z "$NEW_DEPLOY_ID" ] || [ "$NEW_DEPLOY_ID" == "null" ]; then
            echo "❌ Could not parse new deploy ID from Render's response."
            echo "$BODY"
            exit 1
          fi

          echo "✅ Rollback initiated successfully. New deploy ID: $NEW_DEPLOY_ID"
          echo "new_deploy_id=$NEW_DEPLOY_ID" >> $GITHUB_OUTPUT

      - name: Wait and verify rollback
        id: monitor-rollback # Damos un ID al paso
        run: |
          echo "🔍 Monitoring rollback deployment: ${{ steps.execute-rollback.outputs.new_deploy_id }}"
          DEPLOY_ID=${{ steps.execute-rollback.outputs.new_deploy_id }}
          MAX_ATTEMPTS=20
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
          
            # Consultamos la API por el ID específico
            RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID")
            
            STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"')
            
            echo "🔄 Attempt $ATTEMPT/$MAX_ATTEMPTS - Status: $STATUS"
            
            if [ "$STATUS" == "live" ]; then
              echo "✅ Rollback successful! Service is live."
              echo "deploy_status=success" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            if [ "$STATUS" == "build_failed" ] || [ "$STATUS" == "canceled" ] || [ "$STATUS" == "deactivated" ]; then
              echo "❌ Rollback failed with status: $STATUS"
              echo "deploy_status=failed" >> $GITHUB_OUTPUT
              exit 1 # ¡Importante! Falla el job de GitHub
            fi
            
            echo "⏳ Still processing... waiting 30 seconds"
            sleep 30
          done
          
          echo "⏰ Rollback monitoring timeout"
          echo "deploy_status=timeout" >> $GITHUB_OUTPUT
          exit 1 # ¡Importante! Falla el job de GitHub