name: Rollback on Failed Deploy

on:
  workflow_run:
    workflows: ["CD - Deploy Backend"]
    types:
      - completed
    branches:
      - main

jobs:
  rollback:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify deployment failure
        run: |
          echo "⚠️ Deployment to Render failed!"
          echo "🔄 Initiating automatic rollback..."

      - name: Get last successful deploy
        id: get-deploy
        run: |
          echo "🔍 Searching for last successful deployment..."
          
          DEPLOYS=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys?limit=20")
          
          echo "API Response:"
          echo "$DEPLOYS" | jq '.'
          
          # Buscar el último deploy con status "live"
          LAST_SUCCESS=$(echo "$DEPLOYS" | jq -r '[.[] | select(.deploy.status == "live")][0].deploy.id')
          
          if [ "$LAST_SUCCESS" == "null" ] || [ -z "$LAST_SUCCESS" ]; then
            echo "❌ No previous successful deployment found"
            exit 1
          fi
          
          echo "✅ Found last successful deployment: $LAST_SUCCESS"
          echo "deploy_id=$LAST_SUCCESS" >> $GITHUB_OUTPUT

      - name: Get commit from successful deploy
        id: get-commit
        run: |
          echo "🔍 Getting commit SHA from deploy ${{ steps.get-deploy.outputs.deploy_id }}"
          
          DEPLOY_INFO=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/${{ steps.get-deploy.outputs.deploy_id }}")
          
          COMMIT_SHA=$(echo "$DEPLOY_INFO" | jq -r '.deploy.commit.id')
          COMMIT_MSG=$(echo "$DEPLOY_INFO" | jq -r '.deploy.commit.message')
          
          if [ -z "$COMMIT_SHA" ] || [ "$COMMIT_SHA" == "null" ]; then
            echo "❌ Could not get commit SHA"
            exit 1
          fi
          
          echo "✅ Found commit: $COMMIT_SHA"
          echo "📝 Commit message: $COMMIT_MSG"
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Force push rollback commit
        run: |
          echo "🔄 Force pushing commit ${{ steps.get-commit.outputs.commit_sha }} to main"
          
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Reset to the good commit
          git reset --hard ${{ steps.get-commit.outputs.commit_sha }}
          
          # Force push to trigger new deploy
          git push --force origin HEAD:main
          
          echo "✅ Rollback commit pushed successfully"

      - name: Wait for Render to start deploy
        run: |
          echo "⏳ Waiting 30 seconds for Render to detect the push..."
          sleep 30

      - name: Get new deploy ID
        id: get-new-deploy
        run: |
          echo "🔍 Finding the new rollback deploy..."
          
          # Wait a bit more and get latest deploy
          sleep 10
          
          DEPLOYS=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys?limit=5")
          
          # Get the most recent deploy
          NEW_DEPLOY_ID=$(echo "$DEPLOYS" | jq -r '.[0].deploy.id')
          NEW_DEPLOY_STATUS=$(echo "$DEPLOYS" | jq -r '.[0].deploy.status')
          
          echo "📦 Found deploy: $NEW_DEPLOY_ID (status: $NEW_DEPLOY_STATUS)"
          echo "new_deploy_id=$NEW_DEPLOY_ID" >> $GITHUB_OUTPUT

      - name: Monitor rollback deploy
        id: monitor-rollback
        run: |
          echo "🔍 Monitoring rollback deployment: ${{ steps.get-new-deploy.outputs.new_deploy_id }}"
          DEPLOY_ID=${{ steps.get-new-deploy.outputs.new_deploy_id }}
          MAX_ATTEMPTS=30
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
          
            RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID")
            
            STATUS=$(echo "$RESPONSE" | jq -r '.deploy.status // "unknown"')
            
            echo "🔄 Attempt $ATTEMPT/$MAX_ATTEMPTS - Status: $STATUS"
            
            if [ "$STATUS" == "live" ]; then
              echo "✅ Rollback successful! Service is live."
              echo "deploy_status=success" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            if [ "$STATUS" == "build_failed" ] || [ "$STATUS" == "canceled" ] || [ "$STATUS" == "deactivated" ]; then
              echo "❌ Rollback failed with status: $STATUS"
              echo "deploy_status=failed" >> $GITHUB_OUTPUT
              exit 1
            fi
            
            echo "⏳ Still processing... waiting 30 seconds"
            sleep 30
          done
          
          echo "⏰ Rollback monitoring timeout"
          echo "deploy_status=timeout" >> $GITHUB_OUTPUT
          exit 1

      - name: Send notification on success
        if: steps.monitor-rollback.outputs.deploy_status == 'success'
        run: |
          echo "✅ Automatic rollback completed successfully!"
          echo "🎯 Service rolled back to commit: ${{ steps.get-commit.outputs.commit_sha }}"
          
      - name: Send notification on failure
        if: steps.monitor-rollback.outputs.deploy_status != 'success'
        run: |
          echo "❌ Automatic rollback failed or timed out!"
          echo "🔧 Manual intervention may be required."