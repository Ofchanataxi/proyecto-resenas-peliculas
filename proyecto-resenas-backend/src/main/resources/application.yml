spring:
  #Configuracion del data source
  datasource:
    url: jdbc:mysql://localhost:3306/resenas_peliculas?useSSL=false&serverTimezone=UTC
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver

  #configuracion de JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  #Configuracion de Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false

  #Configurar DevTools
  devtools:
    restart:
      enabled: true
  application:
    version: 1.0.0

#Configurar el servidor embebido (Tomcat)
server:
  port: 8080
